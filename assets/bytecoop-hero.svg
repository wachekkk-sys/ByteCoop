<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="550" viewBox="0 0 1440 550" role="img" aria-labelledby="title desc">
<title id="title">ByteCoop — Multiple AIs. One shared intelligence.</title>
<desc id="desc">A dark indigo gradient banner featuring the ByteCoop name, a connected network of OpenAI, DeepSeek, Cortex and Mesh, and the words Many models. One mission.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d20"/><stop offset=".52" stop-color="#111b3a"/><stop offset="1" stop-color="#081122"/></linearGradient>
 <linearGradient id="stroke" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#5186ff"/><stop offset="1" stop-color="#55e4e0"/></linearGradient>
 <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1c2b51" stop-opacity=".9"/><stop offset="1" stop-color="#142141" stop-opacity=".65"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#2762ff" stop-opacity=".3"/><stop offset="1" stop-color="#2762ff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#839ad8" stroke-opacity=".08" stroke-width="1"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
</defs>
<rect width="1440" height="550" rx="20" fill="url(#bg)"/>
<rect width="1440" height="550" rx="20" fill="url(#grid)"/>
<circle cx="1130" cy="275" r="380" fill="url(#glow)"/>
<circle cx="1360" cy="15" r="100" fill="#2654ad" opacity=".16" filter="url(#blur)"/>
