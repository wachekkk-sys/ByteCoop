<path d="M94 77v20M84 87h20" stroke="#55e4e0" stroke-width="3" stroke-linecap="round" opacity=".65"/>
<text x="119" y="96" fill="#f5f8ff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing=".4">ByteCoop</text>
<rect x="74" y="129" width="270" height="31" rx="15.5" fill="#283964" fill-opacity=".8" stroke="#3f5d96" stroke-opacity=".8"/>
<circle cx="94" cy="145" r="4" fill="#5de0c1"/>
<text x="110" y="151" fill="#a9c8ff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">OPEN DEVELOPMENT · ALPHA 0.3</text>
<text x="70" y="243" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="71" font-weight="750" letter-spacing="-2.7">Many models.</text>
<text x="70" y="318" fill="#9ebeff" font-family="Arial, Helvetica, sans-serif" font-size="71" font-weight="750" letter-spacing="-2.7">One mission.</text>
<text x="74" y="376" fill="#a4b5d3" font-family="Arial, Helvetica, sans-serif" font-size="21">Shared context. Coordinated execution.</text>
<text x="74" y="405" fill="#a4b5d3" font-family="Arial, Helvetica, sans-serif" font-size="21">Human control at every critical step.</text>
<path d="M74 464H585" stroke="#6680b4" opacity=".34"/>
